services:
  televault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: televault
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      NODE_ENV: production
      PORT: 3080
      # Optional: Set your Telegram Bot Token here or in a local .env file
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
